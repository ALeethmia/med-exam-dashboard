name: Growth I1 safety checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mock-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Complete browser product and isolated sync regressions
        run: npx playwright test --reporter=line
      - name: Sync UX and isolated B1 decision model
        run: |
          node --test tests/sync-b1/reconcile-model.test.mjs
      - name: Isolated B2-A queue contract and Chromium multi-tab tests
        run: |
          node --test tests/sync-queue/contract.test.mjs
      - name: Isolated B2-B.1 write Adapter
        run: |
          node --test tests/sync-queue/write-adapter.test.mjs
      - name: Synthetic B2-B.1 SDK Emulator integration
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/b2b1-sdk-emulator"
          mkdir -p "$fixture_dir"
          curl --fail --silent --show-error --retry 2 https://storage.googleapis.com/firebase-preview-drop/emulator/firebase-database-emulator-v4.11.2.jar -o "$fixture_dir/database.jar"
          curl --fail --silent --show-error --retry 2 https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js -o "$fixture_dir/firebase-app-compat.js"
          curl --fail --silent --show-error --retry 2 https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js -o "$fixture_dir/firebase-database-compat.js"
          B2B1_EMULATOR_JAR="$fixture_dir/database.jar" FIREBASE_SDK_DIR="$fixture_dir" node tests/sync-queue/adapter-emulator.mjs
          B2B1_EMULATOR_JAR="$fixture_dir/database.jar" FIREBASE_SDK_DIR="$fixture_dir" node tests/sync-queue/durable-course-emulator.mjs
      - name: Canonical auth and Fixtures integration
        shell: bash
        run: |
          set -euo pipefail
          npm run build:growth:review
          python3 -m http.server 8811 --bind 127.0.0.1 --directory .growth-review > /tmp/growth-review-http.log 2>&1 &
          review_pid=$!
          PORT=8812 node server.js > /tmp/growth-host-http.log 2>&1 &
          host_pid=$!
          trap 'kill "$review_pid" "$host_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8811/growth-i1/ > /dev/null && curl --fail --silent http://127.0.0.1:8812/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/growth-i1/repository-layout-http.mjs
          node tests/growth-i1/host-bridge.mjs
          node tests/growth-i1/browser.mjs
          node tests/growth-i1/failure-and-batch.mjs
          node tests/growth-i1/learning-regression.mjs
        env:
          HOST_URL: http://127.0.0.1:8812
          REVIEW_URL: http://127.0.0.1:8811/growth-i1/
          REVIEW_WIDTHS: 1440,390
